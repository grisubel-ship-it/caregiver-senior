workflows:
  ios-workflow:
    name: iOS App Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic new key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.caregiversenior.app
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build React App
        script: |
          echo "Build completata con successo"
    artifacts:
      - "build/ios/ipa/*.ipa"
      - "*.ipa"
