workflows:
  ios-workflow:
    name: iOS App Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic new key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.caregiversenior.app
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build iOS App with Expo
        script: |
          npx expo prebuild --platform ios --clean
          cd ios && pod install
          cd ..
          xcodebuild -workspace ios/caregiversenior.xcworkspace -scheme caregiversenior -sdk iphoneos -configuration Release archive -archivePath $HOME/Library/Developer/Xcode/Archives/caregiversenior.xcarchive
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      
