workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 30
    instance_type: mac_mini_m2
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build React App
        script: |
          mkdir -p build_output
          echo "Test build completato" > build_output/info.txt
    artifacts:
      - "build_output/*.txt"
