workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.tuonome.myapp
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build React App
        script: |
          echo "Build completata con successo"
    artifacts:
      - "build/ios/ipa/*.ipa"
      - "*.ipa"
